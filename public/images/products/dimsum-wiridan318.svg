<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Royal Imperial Purple Foil Gradients -->
    <linearGradient id="pouchBgPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0a33" />
      <stop offset="25%" stop-color="#4d1257" />
      <stop offset="50%" stop-color="#2a0830" />
      <stop offset="75%" stop-color="#5c1668" />
      <stop offset="100%" stop-color="#19041d" />
    </linearGradient>

    <!-- Metallic Foil Sheen -->
    <linearGradient id="foilSheenPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="goldGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <linearGradient id="goldEmbossPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>

    <!-- Steamer Wood Gradient -->
    <linearGradient id="steamerWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <filter id="pouchShadowPurple" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glowGoldPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.5" />
    </filter>

    <clipPath id="pouchShapePurple">
      <path d="M 60 40 Q 250 35 440 40 Q 455 120 450 560 Q 448 600 420 610 Q 250 618 80 610 Q 52 600 50 560 Q 45 120 60 40 Z" />
    </clipPath>
  </defs>

  <g filter="url(#pouchShadowPurple)">
    <path d="M 60 40 Q 250 35 440 40 Q 455 120 450 560 Q 448 600 420 610 Q 250 618 80 610 Q 52 600 50 560 Q 45 120 60 40 Z" fill="url(#pouchBgPurple)" stroke="#7e22ce" stroke-width="2" />

    <g clip-path="url(#pouchShapePurple)">
      <rect x="50" y="30" width="400" height="590" fill="url(#foilSheenPurple)" />

      <!-- Top Seal Pattern -->
      <rect x="50" y="35" width="400" height="42" fill="#1c0521" stroke="#4d1257" stroke-width="1" opacity="0.9" />
      <line x1="50" y1="42" x2="450" y2="42" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="50" y1="50" x2="450" y2="50" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="50" y1="58" x2="450" y2="58" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="50" y1="66" x2="450" y2="66" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

      <path d="M 48 70 L 60 74 L 48 78 Z" fill="#0d0210" />
      <path d="M 452 70 L 440 74 L 452 78 Z" fill="#0d0210" />

      <!-- Top Golden Banner Header -->
      <path d="M 70 85 L 430 85 L 420 120 L 80 120 Z" fill="url(#goldGradPurple)" />
      <text x="250" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" letter-spacing="0.18em" fill="#3a2000" text-anchor="middle">
        PRAKTIS, JUICY &amp; SIAP KUKUS
      </text>

      <!-- 3D Gold Wiridan 318 Brand Emblem -->
      <g transform="translate(250, 195)" filter="url(#glowGoldPurple)">
        <circle cx="0" cy="0" r="54" fill="#29072e" stroke="url(#goldGradPurple)" stroke-width="4" />
        <circle cx="0" cy="0" r="47" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="4 3" opacity="0.8" />
        
        <path d="M -26 -10 C -36 -28 -15 -42 0 -44 C 15 -42 36 -28 26 -10 C 20 -25 5 -32 0 -32 C -5 -32 -20 -25 -26 -10 Z" fill="url(#goldGradPurple)" />
        
        <text x="0" y="-3" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" letter-spacing="0.22em" fill="#FFF3C4" text-anchor="middle">
          WIRIDAN
        </text>
        <rect x="-24" y="6" width="48" height="20" rx="10" fill="url(#goldEmbossPurple)" stroke="#FFE58F" stroke-width="1" />
        <text x="0" y="21" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-weight="900" font-size="14" letter-spacing="0.1em" fill="#1b1202" text-anchor="middle">
          318
        </text>
        <text x="0" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" letter-spacing="0.2em" fill="#FFD700" text-anchor="middle">
          FOOD QUALITY
        </text>
      </g>

      <!-- Main Product Name Typography -->
      <text x="250" y="285" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" letter-spacing="0.02em" fill="#FFFFFF" text-anchor="middle">
        DIMSUM AYAM
      </text>
      <text x="250" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" letter-spacing="0.24em" fill="#FFD700" text-anchor="middle">
        IMPERIAL PURPLE
      </text>

      <!-- Clear Window / Steamer Basket Graphics -->
      <g transform="translate(250, 420)">
        <ellipse cx="0" cy="0" rx="130" ry="78" fill="#1b0520" stroke="url(#goldGradPurple)" stroke-width="3" />
        <ellipse cx="0" cy="0" rx="122" ry="72" fill="#2d0936" opacity="0.95" />

        <!-- Bamboo Steamer Rim -->
        <ellipse cx="0" cy="18" rx="105" ry="48" fill="url(#steamerWood)" stroke="#78350f" stroke-width="2" />
        <ellipse cx="0" cy="14" rx="98" ry="42" fill="#451a03" />

        <!-- Dimsum Siomay 1 (Center) -->
        <g transform="translate(0, 5)">
          <path d="M -22 15 Q -25 -15 -10 -22 Q 0 -18 10 -22 Q 25 -15 22 15 Q 0 25 -22 15 Z" fill="#fed7aa" stroke="#f97316" stroke-width="1" />
          <ellipse cx="0" cy="-18" rx="12" ry="6" fill="#ea580c" />
          <circle cx="-3" cy="-18" r="2" fill="#16a34a" />
          <circle cx="3" cy="-18" r="2" fill="#eab308" />
        </g>

        <!-- Dimsum Siomay 2 (Left) -->
        <g transform="translate(-48, 8)">
          <path d="M -18 12 Q -20 -12 -8 -18 Q 0 -15 8 -18 Q 20 -12 18 12 Q 0 20 -18 12 Z" fill="#fed7aa" stroke="#f97316" stroke-width="1" />
          <ellipse cx="0" cy="-15" rx="10" ry="5" fill="#ea580c" />
          <circle cx="0" cy="-15" r="2" fill="#16a34a" />
        </g>

        <!-- Dimsum Siomay 3 (Right) -->
        <g transform="translate(48, 8)">
          <path d="M -18 12 Q -20 -12 -8 -18 Q 0 -15 8 -18 Q 20 -12 18 12 Q 0 20 -18 12 Z" fill="#fed7aa" stroke="#f97316" stroke-width="1" />
          <ellipse cx="0" cy="-15" rx="10" ry="5" fill="#ea580c" />
          <circle cx="0" cy="-15" r="2" fill="#16a34a" />
        </g>

        <!-- Dimsum Siomay 4 (Top) -->
        <g transform="translate(0, -22)">
          <path d="M -18 12 Q -20 -10 -8 -16 Q 0 -14 8 -16 Q 20 -10 18 12 Q 0 18 -18 12 Z" fill="#fde68a" stroke="#d97706" stroke-width="1" opacity="0.9" />
          <ellipse cx="0" cy="-14" rx="9" ry="4" fill="#ea580c" />
        </g>

        <!-- Steam rising -->
        <path d="M -35 -52 Q -25 -68 -40 -82" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />
        <path d="M 0 -56 Q 10 -72 -2 -88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45" />
        <path d="M 35 -52 Q 45 -68 30 -82" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />
      </g>

      <!-- Bottom Feature Strip -->
      <g transform="translate(250, 525)">
        <rect x="-160" y="0" width="320" height="26" rx="13" fill="#200424" stroke="#9333ea" stroke-width="1" />
        <text x="0" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.08em" fill="#e9d5ff" text-anchor="middle">
          ISIAN PADAT JUICY • KULIT LEMBUT • TOPPING WORTEL
        </text>
      </g>

      <!-- Bottom Legal & Net Weight Footer -->
      <g transform="translate(75, 580)">
        <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#94a3b8">
          DIPRODUKSI OLEH:
        </text>
        <text x="0" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" fill="#f8fafc">
          PT KARYA SANG PRABU
        </text>
      </g>

      <g transform="translate(425, 580)">
        <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="end">
          BERAT BERSIH:
        </text>
        <text x="0" y="14" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-weight="900" font-size="14" fill="#FFD700" text-anchor="end">
          500 g
        </text>
      </g>

      <ellipse cx="250" cy="610" rx="180" ry="10" fill="#100213" opacity="0.8" />
    </g>
  </g>
</svg>
