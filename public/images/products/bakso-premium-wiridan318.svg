<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Sapphire Blue Foil Gradients -->
    <linearGradient id="pouchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2240" />
      <stop offset="25%" stop-color="#123b6b" />
      <stop offset="50%" stop-color="#09254a" />
      <stop offset="75%" stop-color="#184b85" />
      <stop offset="100%" stop-color="#051427" />
    </linearGradient>

    <!-- Metallic Foil Sheen -->
    <linearGradient id="foilSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Gold Foil Headers -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <linearGradient id="goldEmboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>

    <!-- Pouch 3D Shadow -->
    <filter id="pouchShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.5" />
    </filter>

    <!-- Pouch Clip Path -->
    <clipPath id="pouchShape">
      <path d="M 60 40 Q 250 35 440 40 Q 455 120 450 560 Q 448 600 420 610 Q 250 618 80 610 Q 52 600 50 560 Q 45 120 60 40 Z" />
    </clipPath>
  </defs>

  <g filter="url(#pouchShadow)">
    <!-- Stand-up Pouch Body -->
    <path d="M 60 40 Q 250 35 440 40 Q 455 120 450 560 Q 448 600 420 610 Q 250 618 80 610 Q 52 600 50 560 Q 45 120 60 40 Z" fill="url(#pouchBg)" stroke="#1e4e8c" stroke-width="2" />

    <!-- Top Seal Crimping & Tear Notch -->
    <g clip-path="url(#pouchShape)">
      <!-- Metallic Foil Texture Overlay -->
      <rect x="50" y="30" width="400" height="590" fill="url(#foilSheen)" />

      <!-- Top Seal Pattern -->
      <rect x="50" y="35" width="400" height="42" fill="#06182e" stroke="#123b6b" stroke-width="1" opacity="0.9" />
      <line x1="50" y1="42" x2="450" y2="42" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="50" y1="50" x2="450" y2="50" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="50" y1="58" x2="450" y2="58" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="50" y1="66" x2="450" y2="66" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

      <!-- Tear Notches -->
      <path d="M 48 70 L 60 74 L 48 78 Z" fill="#020813" />
      <path d="M 452 70 L 440 74 L 452 78 Z" fill="#020813" />

      <!-- Top Golden Banner Header -->
      <path d="M 70 85 L 430 85 L 420 120 L 80 120 Z" fill="url(#goldGrad)" />
      <text x="250" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" letter-spacing="0.18em" fill="#3a2000" text-anchor="middle">
        KUALITAS PREMIUM RESTO
      </text>

      <!-- 3D Gold Wiridan 318 Brand Emblem -->
      <g transform="translate(250, 195)" filter="url(#glowGold)">
        <!-- Emblem Outer Circle & Laurel Ring -->
        <circle cx="0" cy="0" r="54" fill="#081e36" stroke="url(#goldGrad)" stroke-width="4" />
        <circle cx="0" cy="0" r="47" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="4 3" opacity="0.8" />
        
        <!-- Wheat / Crown Motif -->
        <path d="M -26 -10 C -36 -28 -15 -42 0 -44 C 15 -42 36 -28 26 -10 C 20 -25 5 -32 0 -32 C -5 -32 -20 -25 -26 -10 Z" fill="url(#goldGrad)" />
        
        <!-- WIRIDAN Typography -->
        <text x="0" y="-3" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" letter-spacing="0.22em" fill="#FFF3C4" text-anchor="middle">
          WIRIDAN
        </text>
        <!-- 318 Badge -->
        <rect x="-24" y="6" width="48" height="20" rx="10" fill="url(#goldEmboss)" stroke="#FFE58F" stroke-width="1" />
        <text x="0" y="21" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-weight="900" font-size="14" letter-spacing="0.1em" fill="#1b1202" text-anchor="middle">
          318
        </text>
        <text x="0" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" letter-spacing="0.2em" fill="#FFD700" text-anchor="middle">
          FOOD QUALITY
        </text>
      </g>

      <!-- Main Product Name Typography -->
      <text x="250" y="285" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" letter-spacing="0.02em" fill="#FFFFFF" text-anchor="middle">
        BAKSO SAPI
      </text>
      <text x="250" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" letter-spacing="0.24em" fill="#FFD700" text-anchor="middle">
        PREMIUM SAPPHIRE
      </text>

      <!-- Clear Window / Serving Bowl Graphics -->
      <g transform="translate(250, 420)">
        <!-- Window Frame -->
        <ellipse cx="0" cy="0" rx="130" ry="78" fill="#041122" stroke="url(#goldGrad)" stroke-width="3" />
        <ellipse cx="0" cy="0" rx="122" ry="72" fill="#0a192f" opacity="0.95" />

        <!-- Beef Meatballs in Savory Broth Graphic -->
        <!-- Center Big Meatball -->
        <circle cx="0" cy="-6" r="38" fill="#5a3825" stroke="#3d2315" stroke-width="2" />
        <ellipse cx="-6" cy="-14" rx="28" ry="16" fill="#784c33" opacity="0.6" />
        <!-- Meatball texture specs -->
        <circle cx="-12" cy="-4" r="2.5" fill="#351d10" />
        <circle cx="8" cy="-10" r="3" fill="#351d10" />
        <circle cx="14" cy="5" r="2" fill="#351d10" />
        <circle cx="-4" cy="12" r="3" fill="#351d10" />

        <!-- Left Meatball -->
        <circle cx="-62" cy="6" r="30" fill="#523220" stroke="#382012" stroke-width="1.5" />
        <ellipse cx="-66" cy="-2" rx="20" ry="12" fill="#6e442c" opacity="0.5" />

        <!-- Right Meatball -->
        <circle cx="62" cy="6" r="30" fill="#523220" stroke="#382012" stroke-width="1.5" />
        <ellipse cx="58" cy="-2" rx="20" ry="12" fill="#6e442c" opacity="0.5" />

        <!-- Top Meatball -->
        <circle cx="-28" cy="-30" r="22" fill="#4a2c1a" opacity="0.9" />
        <circle cx="28" cy="-30" r="22" fill="#4a2c1a" opacity="0.9" />

        <!-- Fresh Celery & Fried Onion Accents -->
        <path d="M -15 15 Q -10 8 0 16 Q 10 8 15 15 Z" fill="#22c55e" opacity="0.85" />
        <circle cx="-18" cy="18" r="2" fill="#eab308" />
        <circle cx="22" cy="14" r="2.5" fill="#ca8a04" />
        <circle cx="5" cy="24" r="2" fill="#eab308" />

        <!-- Rich Broth Glistening Steam -->
        <path d="M -40 -52 Q -30 -68 -45 -82" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />
        <path d="M 0 -56 Q 10 -72 -2 -88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45" />
        <path d="M 40 -52 Q 50 -68 35 -82" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />
      </g>

      <!-- Bottom Product Features Strip -->
      <g transform="translate(250, 525)">
        <rect x="-160" y="0" width="320" height="26" rx="13" fill="#041224" stroke="#1d4ed8" stroke-width="1" />
        <text x="0" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.08em" fill="#93c5fd" text-anchor="middle">
          DAGING SAPI ASLI • KENYAL ALAMI • TANPA PENGAWET
        </text>
      </g>

      <!-- Bottom Legal & Net Weight Footer -->
      <g transform="translate(75, 580)">
        <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#94a3b8">
          DIPRODUKSI OLEH:
        </text>
        <text x="0" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" fill="#f8fafc">
          PT KARYA SANG PRABU
        </text>
      </g>

      <g transform="translate(425, 580)">
        <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="end">
          BERAT BERSIH:
        </text>
        <text x="0" y="14" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-weight="900" font-size="14" fill="#FFD700" text-anchor="end">
          500 g
        </text>
      </g>

      <!-- Bottom Pouch Stand Base Shadow -->
      <ellipse cx="250" cy="610" rx="180" ry="10" fill="#020914" opacity="0.8" />
    </g>
  </g>
</svg>
