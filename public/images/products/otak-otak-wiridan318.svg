<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Forest Green Foil Gradients -->
    <linearGradient id="pouchBgGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042013" />
      <stop offset="25%" stop-color="#0a3d24" />
      <stop offset="50%" stop-color="#052416" />
      <stop offset="75%" stop-color="#0e4e2f" />
      <stop offset="100%" stop-color="#02120a" />
    </linearGradient>

    <!-- Metallic Foil Sheen -->
    <linearGradient id="foilSheenGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="goldGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <linearGradient id="goldEmbossGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>

    <filter id="pouchShadowGreen" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glowGoldGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.5" />
    </filter>

    <clipPath id="pouchShapeGreen">
      <path d="M 60 40 Q 250 35 440 40 Q 455 120 450 560 Q 448 600 420 610 Q 250 618 80 610 Q 52 600 50 560 Q 45 120 60 40 Z" />
    </clipPath>
  </defs>

  <g filter="url(#pouchShadowGreen)">
    <path d="M 60 40 Q 250 35 440 40 Q 455 120 450 560 Q 448 600 420 610 Q 250 618 80 610 Q 52 600 50 560 Q 45 120 60 40 Z" fill="url(#pouchBgGreen)" stroke="#15803d" stroke-width="2" />

    <g clip-path="url(#pouchShapeGreen)">
      <rect x="50" y="30" width="400" height="590" fill="url(#foilSheenGreen)" />

      <!-- Top Seal Pattern -->
      <rect x="50" y="35" width="400" height="42" fill="#041a0f" stroke="#0a3d24" stroke-width="1" opacity="0.9" />
      <line x1="50" y1="42" x2="450" y2="42" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="50" y1="50" x2="450" y2="50" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="50" y1="58" x2="450" y2="58" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <line x1="50" y1="66" x2="450" y2="66" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

      <path d="M 48 70 L 60 74 L 48 78 Z" fill="#010a05" />
      <path d="M 452 70 L 440 74 L 452 78 Z" fill="#010a05" />

      <!-- Top Golden Banner Header -->
      <path d="M 70 85 L 430 85 L 420 120 L 80 120 Z" fill="url(#goldGradGreen)" />
      <text x="250" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" letter-spacing="0.18em" fill="#3a2000" text-anchor="middle">
        IKAN SEGAR &amp; AROMA REMPAH ASLI
      </text>

      <!-- 3D Gold Wiridan 318 Brand Emblem -->
      <g transform="translate(250, 195)" filter="url(#glowGoldGreen)">
        <circle cx="0" cy="0" r="54" fill="#062215" stroke="url(#goldGradGreen)" stroke-width="4" />
        <circle cx="0" cy="0" r="47" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="4 3" opacity="0.8" />
        
        <path d="M -26 -10 C -36 -28 -15 -42 0 -44 C 15 -42 36 -28 26 -10 C 20 -25 5 -32 0 -32 C -5 -32 -20 -25 -26 -10 Z" fill="url(#goldGradGreen)" />
        
        <text x="0" y="-3" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" letter-spacing="0.22em" fill="#FFF3C4" text-anchor="middle">
          WIRIDAN
        </text>
        <rect x="-24" y="6" width="48" height="20" rx="10" fill="url(#goldEmbossGreen)" stroke="#FFE58F" stroke-width="1" />
        <text x="0" y="21" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-weight="900" font-size="14" letter-spacing="0.1em" fill="#1b1202" text-anchor="middle">
          318
        </text>
        <text x="0" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" letter-spacing="0.2em" fill="#FFD700" text-anchor="middle">
          FOOD QUALITY
        </text>
      </g>

      <!-- Main Product Name Typography -->
      <text x="250" y="285" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="28" letter-spacing="0.02em" fill="#FFFFFF" text-anchor="middle">
        OTAK-OTAK IKAN
      </text>
      <text x="250" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" letter-spacing="0.24em" fill="#FFD700" text-anchor="middle">
        FOREST GREEN
      </text>

      <!-- Clear Window / Otak-Otak Fish Graphic -->
      <g transform="translate(250, 420)">
        <ellipse cx="0" cy="0" rx="130" ry="78" fill="#04170d" stroke="url(#goldGradGreen)" stroke-width="3" />
        <ellipse cx="0" cy="0" rx="122" ry="72" fill="#092919" opacity="0.95" />

        <!-- Banana Leaf base -->
        <path d="M -90 10 Q 0 45 90 10 Q 0 25 -90 10 Z" fill="#15803d" opacity="0.75" />

        <!-- Otak-Otak Fish Sticks with char marks -->
        <!-- Stick 1 (Center) -->
        <g transform="translate(0, 0) rotate(-6)">
          <rect x="-65" y="-10" width="130" height="20" rx="10" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
          <!-- Grill char marks -->
          <line x1="-35" y1="-8" x2="-30" y2="8" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
          <line x1="-5" y1="-8" x2="0" y2="8" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
          <line x1="25" y1="-8" x2="30" y2="8" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="-15" cy="-2" r="1.5" fill="#16a34a" />
          <circle cx="15" cy="2" r="1.5" fill="#16a34a" />
        </g>

        <!-- Stick 2 (Top) -->
        <g transform="translate(5, -24) rotate(4)">
          <rect x="-60" y="-8" width="120" height="16" rx="8" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2" />
          <line x1="-30" y1="-6" x2="-26" y2="6" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
          <line x1="0" y1="-6" x2="4" y2="6" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
          <line x1="30" y1="-6" x2="34" y2="6" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
        </g>

        <!-- Stick 3 (Bottom) -->
        <g transform="translate(-5, 24) rotate(-3)">
          <rect x="-60" y="-8" width="120" height="16" rx="8" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2" />
          <line x1="-25" y1="-6" x2="-20" y2="6" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
          <line x1="5" y1="-6" x2="10" y2="6" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
          <line x1="35" y1="-6" x2="40" y2="6" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
        </g>

        <!-- Chili Sauce Dish Accent -->
        <g transform="translate(68, 8)">
          <ellipse cx="0" cy="0" rx="16" ry="12" fill="#991b1b" stroke="#fca5a5" stroke-width="1" />
          <circle cx="-2" cy="-2" r="2" fill="#ef4444" />
          <circle cx="2" cy="2" r="1.5" fill="#facc15" />
        </g>

        <!-- Steam -->
        <path d="M -30 -52 Q -20 -68 -35 -82" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />
        <path d="M 0 -56 Q 10 -72 -2 -88" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45" />
        <path d="M 30 -52 Q 40 -68 25 -82" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />
      </g>

      <!-- Bottom Feature Strip -->
      <g transform="translate(250, 525)">
        <rect x="-160" y="0" width="320" height="26" rx="13" fill="#041d10" stroke="#16a34a" stroke-width="1" />
        <text x="0" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.08em" fill="#bbf7d0" text-anchor="middle">
          IKAN TENGGIRI / KAKAP SEGAR • HARUM SANTAN &amp; DAUN
        </text>
      </g>

      <!-- Bottom Legal & Net Weight Footer -->
      <g transform="translate(75, 580)">
        <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#94a3b8">
          DIPRODUKSI OLEH:
        </text>
        <text x="0" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" fill="#f8fafc">
          PT KARYA SANG PRABU
        </text>
      </g>

      <g transform="translate(425, 580)">
        <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="end">
          BERAT BERSIH:
        </text>
        <text x="0" y="14" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-weight="900" font-size="14" fill="#FFD700" text-anchor="end">
          500 g
        </text>
      </g>

      <ellipse cx="250" cy="610" rx="180" ry="10" fill="#020d07" opacity="0.8" />
    </g>
  </g>
</svg>
