<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="kspGoldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F"/>
      <stop offset="30%" stop-color="#F5C451"/>
      <stop offset="65%" stop-color="#D49B22"/>
      <stop offset="100%" stop-color="#9E6D05"/>
    </linearGradient>

    <linearGradient id="kspGoldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#E5A924"/>
      <stop offset="100%" stop-color="#8C5E00"/>
    </linearGradient>

    <!-- Emerald Leaf Accents -->
    <linearGradient id="kspGreenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40C057"/>
      <stop offset="60%" stop-color="#2B8A3E"/>
      <stop offset="100%" stop-color="#145A24"/>
    </linearGradient>

    <!-- Crimson Knot -->
    <linearGradient id="kspRedAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA5252"/>
      <stop offset="100%" stop-color="#C92A2A"/>
    </linearGradient>

    <!-- Glow & Shadow -->
    <filter id="kspGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Curved Text Path -->
    <path id="kspTextArc" d="M 160 540 A 290 290 0 0 0 640 540" fill="none" />
  </defs>

