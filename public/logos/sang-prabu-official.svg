<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Wheat and Crown -->
    <linearGradient id="spGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C542"/>
      <stop offset="45%" stop-color="#DE9E02"/>
      <stop offset="85%" stop-color="#C68800"/>
      <stop offset="100%" stop-color="#B27400"/>
    </linearGradient>

    <!-- Green Gradient for Swoosh & Text -->
    <linearGradient id="spGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F9E44"/>
      <stop offset="100%" stop-color="#1B7A32"/>
    </linearGradient>

    <!-- Red Gradient for Ribbon & Knot -->
    <linearGradient id="spRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E03131"/>
      <stop offset="100%" stop-color="#C92A2A"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Luxury Depth -->
    <filter id="spShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Curved path for arched text "SANG PRABU" -->
    <path id="spTextArc" d="M 170 540 A 280 280 0 0 0 630 540" fill="none" />
  </defs>

  <!-- Group with Shadow Filter -->
  <g filter="url(#spShadow)">
    <!-- ================= 1. WHEAT EARS (BULIR PADI KIRI & KANAN) ================= -->
    <!-- LEFT WHEAT STALK (Padi Kiri) -->
    <g fill="url(#spGoldGrad)" stroke="#B27400" stroke-width="1.5">
      <!-- Stalk Spine -->
      <path d="M 270 510 C 210 440 180 320 250 150 C 252 145 255 147 254 152 C 185 320 215 440 274 508 Z" fill="#DE9E02" />
      
      <!-- Grains Pair 1 (Bottom) -->
      <path d="M 255 470 C 230 455 210 470 215 490 C 225 505 255 495 255 470 Z"/>
      <path d="M 268 450 C 250 430 235 440 238 460 C 245 475 272 468 268 450 Z"/>

      <!-- Grains Pair 2 -->
      <path d="M 235 430 C 205 410 185 425 190 445 C 200 460 235 450 235 430 Z"/>
      <path d="M 252 410 C 230 385 210 395 215 418 C 225 435 255 425 252 410 Z"/>

      <!-- Grains Pair 3 -->
      <path d="M 215 385 C 180 360 165 378 170 400 C 180 418 215 405 215 385 Z"/>
      <path d="M 236 362 C 210 338 190 350 195 372 C 205 390 238 380 236 362 Z"/>

      <!-- Grains Pair 4 -->
      <path d="M 200 335 C 165 310 150 328 155 350 C 165 368 200 355 200 335 Z"/>
      <path d="M 224 312 C 195 288 178 300 185 325 C 195 342 228 330 224 312 Z"/>

      <!-- Grains Pair 5 -->
      <path d="M 195 280 C 160 255 148 272 155 295 C 165 312 195 300 195 280 Z"/>
      <path d="M 218 258 C 190 235 175 248 182 272 C 192 290 222 278 218 258 Z"/>

      <!-- Grains Pair 6 -->
      <path d="M 198 225 C 168 200 158 218 165 240 C 175 258 200 245 198 225 Z"/>
      <path d="M 220 205 C 195 180 180 195 190 218 C 200 235 225 222 220 205 Z"/>

      <!-- Grains Pair 7 (Top) -->
      <path d="M 215 170 C 190 148 180 165 188 185 C 198 202 220 190 215 170 Z"/>
      <path d="M 235 152 C 215 130 200 142 210 162 C 220 178 240 168 235 152 Z"/>
      <path d="M 252 135 C 240 115 225 125 232 142 C 240 155 255 148 252 135 Z"/>

      <!-- Delicate Awn Hairs (Kumis Padi) -->
      <path d="M 245 125 C 235 90 220 70 205 55" stroke="#DE9E02" stroke-width="2.5" fill="none"/>
      <path d="M 230 140 C 205 105 180 80 160 65" stroke="#DE9E02" stroke-width="2.5" fill="none"/>
      <path d="M 205 165 C 175 130 150 110 125 95" stroke="#DE9E02" stroke-width="2" fill="none"/>
    </g>

    <!-- RIGHT WHEAT STALK (Padi Kanan - Mirrored) -->
    <g transform="translate(800,0) scale(-1,1)" fill="url(#spGoldGrad)" stroke="#B27400" stroke-width="1.5">
      <!-- Stalk Spine -->
      <path d="M 270 510 C 210 440 180 320 250 150 C 252 145 255 147 254 152 C 185 320 215 440 274 508 Z" fill="#DE9E02" />
      
      <!-- Grains Pair 1 -->
      <path d="M 255 470 C 230 455 210 470 215 490 C 225 505 255 495 255 470 Z"/>
      <path d="M 268 450 C 250 430 235 440 238 460 C 245 475 272 468 268 450 Z"/>

      <!-- Grains Pair 2 -->
      <path d="M 235 430 C 205 410 185 425 190 445 C 200 460 235 450 235 430 Z"/>
      <path d="M 252 410 C 230 385 210 395 215 418 C 225 435 255 425 252 410 Z"/>

      <!-- Grains Pair 3 -->
      <path d="M 215 385 C 180 360 165 378 170 400 C 180 418 215 405 215 385 Z"/>
      <path d="M 236 362 C 210 338 190 350 195 372 C 205 390 238 380 236 362 Z"/>

      <!-- Grains Pair 4 -->
      <path d="M 200 335 C 165 310 150 328 155 350 C 165 368 200 355 200 335 Z"/>
      <path d="M 224 312 C 195 288 178 300 185 325 C 195 342 228 330 224 312 Z"/>

      <!-- Grains Pair 5 -->
      <path d="M 195 280 C 160 255 148 272 155 295 C 165 312 195 300 195 280 Z"/>
      <path d="M 218 258 C 190 235 175 248 182 272 C 192 290 222 278 218 258 Z"/>

      <!-- Grains Pair 6 -->
      <path d="M 198 225 C 168 200 158 218 165 240 C 175 258 200 245 198 225 Z"/>
      <path d="M 220 205 C 195 180 180 195 190 218 C 200 235 225 222 220 205 Z"/>

      <!-- Grains Pair 7 (Top) -->
      <path d="M 215 170 C 190 148 180 165 188 185 C 198 202 220 190 215 170 Z"/>
      <path d="M 235 152 C 215 130 200 142 210 162 C 220 178 240 168 235 152 Z"/>
      <path d="M 252 135 C 240 115 225 125 232 142 C 240 155 255 148 252 135 Z"/>

      <!-- Awns -->
      <path d="M 245 125 C 235 90 220 70 205 55" stroke="#DE9E02" stroke-width="2.5" fill="none"/>
      <path d="M 230 140 C 205 105 180 80 160 65" stroke="#DE9E02" stroke-width="2.5" fill="none"/>
      <path d="M 205 165 C 175 130 150 110 125 95" stroke="#DE9E02" stroke-width="2" fill="none"/>
    </g>

    <!-- ================= 2. GOLDEN CROWN & LOTUS (MAHKOTA PUSAT) ================= -->
    <g fill="url(#spGoldGrad)" stroke="#B27400" stroke-width="1.5">
      <!-- Central Large Oval Petal -->
      <path d="M 400 210 C 375 250 355 330 365 435 C 390 445 410 445 435 435 C 445 330 425 250 400 210 Z"/>
      
      <!-- Inner Left Petal -->
      <path d="M 355 270 C 335 305 320 370 338 430 C 348 433 360 435 372 435 C 360 360 370 300 355 270 Z"/>

      <!-- Inner Right Petal -->
      <path d="M 445 270 C 465 305 480 370 462 430 C 452 433 440 435 428 435 C 440 360 430 300 445 270 Z"/>

      <!-- Outer Left Petal (Pointed Wing) -->
      <path d="M 310 325 C 290 355 278 405 312 438 C 322 435 332 430 340 425 C 322 375 330 340 310 325 Z"/>

      <!-- Outer Right Petal (Pointed Wing) -->
      <path d="M 490 325 C 510 355 522 405 488 438 C 478 435 468 430 460 425 C 478 375 470 340 490 325 Z"/>

      <!-- 5 Golden Spheres / Crown Jewels on top -->
      <!-- Center Sphere -->
      <circle cx="400" cy="190" r="16" />
      <!-- Inner Left Sphere -->
      <circle cx="348" cy="245" r="13" />
      <!-- Inner Right Sphere -->
      <circle cx="452" cy="245" r="13" />
      <!-- Outer Left Sphere -->
      <circle cx="295" cy="305" r="11" />
      <!-- Outer Right Sphere -->
      <circle cx="505" cy="305" r="11" />
    </g>

    <!-- ================= 3. TWO DYNAMIC GREEN SWOOSH ARCS (LENGKUNGAN HIJAU) ================= -->
    <g fill="url(#spGreenGrad)">
      <!-- Upper Green Arc -->
      <path d="M 285 450 C 350 495 450 495 515 450 C 460 508 340 508 285 450 Z" />
      <!-- Lower Green Arc -->
      <path d="M 305 480 C 360 520 440 520 495 480 C 450 535 350 535 305 480 Z" />
    </g>

    <!-- ================= 4. RED RIBBON & INFINITY KNOT (PITA & SIMPUL MERAH) ================= -->
    <g fill="url(#spRedGrad)" stroke="url(#spRedGrad)">
      <!-- Left Ribbon Arc -->
      <path d="M 270 508 C 310 545 365 560 380 560 C 365 556 315 540 274 506 Z" />
      <!-- Right Ribbon Arc -->
      <path d="M 530 508 C 490 545 435 560 420 560 C 435 556 485 540 526 506 Z" />

      <!-- Center Figure-8 Knot -->
      <!-- Left Loop -->
      <path d="M 380 560 C 370 550 360 555 360 565 C 360 575 372 580 385 570 C 395 562 405 562 415 570 C 428 580 440 575 440 565 C 440 555 430 550 420 560 C 410 568 390 568 380 560 Z" 
            fill="none" stroke="#C92A2A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="375" cy="565" r="4" fill="#E03131" stroke="none" />
      <circle cx="425" cy="565" r="4" fill="#E03131" stroke="none" />
    </g>

    <!-- ================= 5. ARCHED BRAND TEXT "SANG PRABU" ================= -->
    <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="58" letter-spacing="0.16em" fill="#1B7A32">
      <textPath href="#spTextArc" startOffset="50%" text-anchor="middle">
        SANG PRABU
      </textPath>
    </text>
  </g>
</svg>
