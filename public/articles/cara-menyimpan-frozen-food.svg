<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cara menyimpan frozen food agar tetap segar dan aman">
  <defs>
    <linearGradient id="cs1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4D21"/>
      <stop offset="1" stop-color="#062F14"/>
    </linearGradient>
    <linearGradient id="csg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1D27A"/>
      <stop offset="1" stop-color="#DEA402"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#cs1)"/>
  <!-- snowflakes / suasana beku -->
  <g stroke="#BFE3C6" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <g transform="translate(980,180)">
      <line x1="0" y1="-70" x2="0" y2="70"/>
      <line x1="-70" y1="0" x2="70" y2="0"/>
      <line x1="-50" y1="-50" x2="50" y2="50"/>
      <line x1="-50" y1="50" x2="50" y2="-50"/>
    </g>
    <g transform="translate(1080,470) scale(0.6)">
      <line x1="0" y1="-70" x2="0" y2="70"/>
      <line x1="-70" y1="0" x2="70" y2="0"/>
      <line x1="-50" y1="-50" x2="50" y2="50"/>
      <line x1="-50" y1="50" x2="50" y2="-50"/>
    </g>
  </g>
  <g fill="#DDF0E1" opacity="0.65">
    <circle cx="900" cy="430" r="5"/><circle cx="860" cy="300" r="4"/>
    <circle cx="1120" cy="250" r="5"/><circle cx="930" cy="520" r="4"/>
  </g>
  <!-- ikon freezer / kotak penyimpanan -->
  <g transform="translate(905,470)">
    <rect x="-96" y="-96" width="192" height="192" rx="20" fill="url(#csg)"/>
    <rect x="-96" y="-96" width="192" height="192" rx="20" fill="none" stroke="#0B4D21" stroke-width="4" opacity="0.35"/>
    <rect x="-64" y="-64" width="128" height="52" rx="8" fill="#0B4D21" opacity="0.85"/>
    <rect x="-64" y="4" width="128" height="60" rx="8" fill="#0B4D21" opacity="0.85"/>
    <circle cx="44" cy="-38" r="6" fill="#F1D27A"/>
    <circle cx="44" cy="34" r="6" fill="#F1D27A"/>
  </g>
  <rect x="70" y="86" width="330" height="44" rx="22" fill="url(#csg)"/>
  <text x="90" y="116" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#0B4D21">EDUKASI FROZEN FOOD HALAL</text>
  <text x="70" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="800" fill="#FFFFFF">Cara Menyimpan</text>
  <text x="70" y="358" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="800" fill="#FFFFFF">Frozen Food</text>
  <text x="70" y="422" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#F1D27A">Tetap Segar &amp; Aman Dikonsumsi</text>
  <text x="70" y="474" font-family="Arial, sans-serif" font-size="24" fill="#CFE8D3">Suhu freezer, masa simpan, thawing &amp; tips</text>
  <text x="70" y="620" font-family="Arial, sans-serif" font-size="22" letter-spacing="3" fill="#FFFFFF" opacity="0.7">PRIMA PRABU GROUP · SANG PRABU</text>
</svg>
